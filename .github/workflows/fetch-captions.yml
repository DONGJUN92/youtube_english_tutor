name: fetch-captions

# GitHub-hosted IPs are LOGIN_REQUIRED for InnerTube and for a headless
# YouTube embed. Live fetches run from the caption relay / Grok worker
# (non-datacenter IP) and POST timed captions to /api/captions.
on:
  workflow_dispatch:
    inputs:
      video_id:
        description: YouTube video id
        required: false
        default: ""
  repository_dispatch:
    types: [fetch-captions]

concurrency:
  group: fetch-captions
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch timed YouTube captions
        env:
          VIDEO_ID: ${{ github.event.client_payload.video_id || github.event.inputs.video_id }}
          CAPTION_POST_URL: https://tubeshadow.vercel.app/api/captions
          CAPTION_JOBS_URL: https://tubeshadow.vercel.app/api/caption-jobs
          GHA_EMBED: "0"
        run: node scripts/gha-fetch-captions.mjs
