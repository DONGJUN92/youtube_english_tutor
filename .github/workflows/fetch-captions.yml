name: fetch-captions

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: YouTube video id
        required: false
        default: ""
  repository_dispatch:
    types: [fetch-captions]
  schedule:
    - cron: "* * * * *"

concurrency:
  group: fetch-captions
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch timed YouTube captions
        env:
          VIDEO_ID: ${{ github.event.client_payload.video_id || github.event.inputs.video_id }}
          CAPTION_POST_URL: https://tubeshadow.vercel.app/api/captions
          CAPTION_JOBS_URL: https://tubeshadow.vercel.app/api/caption-jobs
          GHA_EMBED: "0"
        run: node scripts/gha-fetch-captions.mjs

  fetch-embed:
    if: failure()
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0 && npx playwright install --with-deps chromium
      - name: Fetch captions via YouTube embed
        env:
          VIDEO_ID: ${{ github.event.client_payload.video_id || github.event.inputs.video_id }}
          CAPTION_POST_URL: https://tubeshadow.vercel.app/api/captions
          CAPTION_JOBS_URL: https://tubeshadow.vercel.app/api/caption-jobs
          GHA_EMBED: "1"
        run: node scripts/gha-fetch-captions.mjs
